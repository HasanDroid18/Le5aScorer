name: Build & Screenshots

# Builds the app and captures a screenshot of every screen on an emulator, then
# commits the images to docs/screenshots/ on the branch.
#
# This exists because the environment the redesign was developed in cannot reach
# Google's Maven, so it has no Android SDK and no way to build or render the app.
# A GitHub runner has the whole toolchain.

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
    paths-ignore:
      # Never retrigger on the images this workflow itself commits.
      - 'docs/screenshots/**'

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # The build itself is the point: this branch had never been compiled.
      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble instrumentation tests
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      # Non-blocking: lint is the tool most likely to catch design problems that
      # a build cannot — contrast, missing contentDescription, unused resources.
      - name: Lint
        continue-on-error: true
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            # Scoped to the screenshot class so nothing unrelated can red the job.
            # Kept on one line: this action does not pass shell line-continuation
            # backslashes through, so a wrapped command reaches Gradle with the
            # continuation character itself parsed as a task name.
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.hasanDroid.le5ascorer.ScreenshotTest --stacktrace
            mkdir -p docs/screenshots
            adb pull /sdcard/Android/data/com.hasanDroid.le5ascorer/files/screenshots/. docs/screenshots/ || true
            ls -la docs/screenshots/

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

      - name: Commit screenshots
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/screenshots/
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "Add emulator screenshots of the redesign [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
