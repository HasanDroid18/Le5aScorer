name: Build & Screenshots

# Builds the app and captures a screenshot of every screen on an emulator, then
# commits the images to docs/screenshots/ on the branch.
#
# This exists because the environment the redesign was developed in cannot reach
# Google's Maven, so it has no Android SDK and no way to build or render the app.
# A GitHub runner has the whole toolchain.

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
    paths-ignore:
      # Never retrigger on the images this workflow itself commits.
      - 'docs/screenshots/**'

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    # Pinned rather than ubuntu-latest. The emulator booted here in 72s on
    # 19 Aug and has not come up once since — across two different system
    # images, which rules the image out. The symptom is not a slow boot: adb
    # reports "device 'emulator-5554' not found" for the entire wait, so the
    # emulator process is never alive to be waited on. A runner-image rollout
    # in that window is the remaining explanation, and android-emulator-runner
    # is known-good on 22.04.
    #
    # If this pin ever stops resolving, the diagnostics step below prints what
    # the runner actually is, so the next failure is readable rather than
    # another round of guessing.
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # Cheap, and it runs before the four-minute build so an environment
      # problem is visible immediately rather than 20 minutes in.
      - name: Runner diagnostics
        run: |
          echo "===== runner ====="
          cat /etc/os-release | head -3
          uname -a
          echo "===== kvm ====="
          ls -l /dev/kvm || echo "NO /dev/kvm"
          egrep -c '(vmx|svm)' /proc/cpuinfo || echo "no virtualisation flags"
          echo "===== sdk ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/emulator/emulator" || echo "no emulator binary"
          "$ANDROID_HOME/emulator/emulator" -version 2>&1 | head -3 || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # The build itself is the point: this branch had never been compiled.
      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble instrumentation tests
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      # Non-blocking: lint is the tool most likely to catch design problems that
      # a build cannot — contrast, missing contentDescription, unused resources.
      - name: Lint
        continue-on-error: true
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 34 / google_apis, which is the combination that actually boots
          # here — it came up in 72s. A previous run timed out and this was
          # switched to API 33 / default on the theory that the smaller AOSP
          # image would be steadier; instead it never booted once, twice in a
          # row. That was the regression, not a flake, so it is reverted.
          # The raised boot timeout and -no-snapshot-save stay: they were the
          # other half of that change and neither is implicated.
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: |
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            # Scoped to the screenshot class so nothing unrelated can red the job.
            # Kept on one line: this action does not pass shell line-continuation
            # backslashes through, so a wrapped command reaches Gradle with the
            # continuation character itself parsed as a task name.
            # No --stacktrace: it buries the actual test failure under ~200 lines
            # of Gradle internals.
            # Capture the status with "|| STATUS=$?" rather than "set +e" plus
            # "$?". The action runs this script under sh -e, and the set +e was
            # not surviving, so a failing gradlew aborted the script on the spot
            # — the pull and the diagnostics below never ran, which is why a
            # failing run reported "No screenshots were captured" with no
            # explanation. A command on the left of || is exempt from -e by
            # POSIX, so this holds regardless of what the harness sets.
            STATUS=0
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.hasanDroid.le5ascorer.ScreenshotTest || STATUS=$?
            # Pull whatever was captured before any failure. A partial walk still
            # shows the screens it reached, and how far it got is diagnostic.
            mkdir -p docs/screenshots
            adb pull /sdcard/Android/data/com.hasanDroid.le5ascorer/files/screenshots/. docs/screenshots/ || true
            ls -la docs/screenshots/ || true
            if [ $STATUS -ne 0 ]; then
              # Write the failure into docs/screenshots/ so the commit step
              # below carries it back to the branch. The workflow log can only
              # be read from its tail, and the interesting lines sit ~100 lines
              # from the end under a wall of Gradle output — several rounds went
              # into fishing them out. A file on the branch is one git fetch.
              {
                echo "run:    ${{ github.run_number }} (${{ github.sha }})"
                echo "status: $STATUS"
                echo
                grep -h -A4 -E '(FAILED|failure message=)' app/build/outputs/androidTest-results/*/*.xml 2>/dev/null | head -40
              } > docs/screenshots/LAST_FAILURE.txt || true
              echo "===================== test results ====================="
              find app/build/outputs/androidTest-results -name '*.xml' -exec cat {} + | head -120 || true
              # The walk dumps the window hierarchy whenever a selector misses.
              # Printing just the resource ids that were actually on screen is
              # what distinguishes "the screen never came up" from "the view is
              # there but GONE" — the two are identical in the hierarchy, and
              # guessing between them has cost several runs.
              if [ -f docs/screenshots/hierarchy-on-failure.xml ]; then
                echo "================ ids on the failing screen ============"
                grep -o 'resource-id="[^"]*"' docs/screenshots/hierarchy-on-failure.xml | sort -u | head -60 || true
              fi
              echo "===================== crash log ======================="
              adb logcat -d -s AndroidRuntime:E TestRunner:I System.err:W | tail -80 || true
            fi
            exit $STATUS

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

      # Runs even when the walk failed part way: partial screenshots are still
      # the only way to see the redesign, and which screen it stopped at says
      # a lot about why.
      - name: Commit screenshots
        if: always()
        run: |
          # The emulator can fail before the script ever runs, in which case the
          # directory does not exist at all — guard rather than dying on git add.
          if [ -z "$(ls -A docs/screenshots 2>/dev/null)" ]; then
            echo "No screenshots were captured; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/screenshots/
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "Add emulator screenshots of the redesign [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
